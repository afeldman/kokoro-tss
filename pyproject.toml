[project]
name = "kokoro-tts"
version = "0.1.0"
description = "Local Kokoro Text-to-Speech Service with FastAPI and Typer CLI"
readme = "README.md"
authors = [
    { name = "Anton Feldmann", email = "anton.feldmann@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
dependencies = [
    "kokoro>=0.9.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
kokoro-tts = "kokoro_tts:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
